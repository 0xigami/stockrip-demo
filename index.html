var SR_SEASONS = ['Classic', 'Christmas', 'Lunar New Year', 'Valentine’s'];

var SR_SEASON_KEY = 'srp4-season';
var SR_MAIN_WRAP = { 'Classic': 'None', 'Christmas': 'Christmas', 'Lunar New Year': 'Lunar New Year', 'Valentine’s': 'Valentine’s' };
var SR_HOME_SEASON = { 'Classic': 'Classic', 'Christmas': 'Christmas', 'Lunar New Year': 'Lunar New Year', 'Valentine’s': "Valentine's" };
var SR_WRAP_KEY = { 'Christmas': 'xmas', 'Lunar New Year': 'lny', 'Valentine’s': 'val' };
var SR_WRAP_NAME = { std: 'Classic', xmas: 'Christmas', lny: 'Lunar New Year', val: 'Valentine’s' };
var SR_SEASON_OF_WRAP = { std: 'Classic', xmas: 'Christmas', lny: 'Lunar New Year', val: 'Valentine’s' };
var SR_ROUTES = ['home', 'home-phone', 'gifts', 'app', 'gift', 'gift-locked', 'gift-checkout', 'card', 'returning'];

function srDevice() {
  var ua = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
  var touchMac = /Macintosh/.test(ua) && typeof navigator !== 'undefined' && navigator.maxTouchPoints > 1;
  var inApp = /FBAN|FBAV|Instagram|Twitter|Line\/|musical_ly|BytedanceWebview|Snapchat|LinkedInApp/.test(ua);
  if (/iPad/.test(ua) || touchMac) return 'iPad Safari';
  if (/iPhone|iPod/.test(ua)) {
    if (inApp) return 'In-app browser (iPhone)';
    if (/CriOS|FxiOS|EdgiOS/.test(ua)) return 'iPhone Chrome';
    var v = /Version\/(\d+)/.exec(ua);
    var n = v ? +v[1] : 18;
    return n >= 27 ? 'iPhone Safari (iOS 27)' : n >= 26 ? 'iPhone Safari (iOS 26)' : 'iPhone Safari (iOS 18)';
  }
  if (/Android/.test(ua)) {
    if (inApp || /; wv\)/.test(ua)) return 'In-app browser (Android)';
    if (/Firefox/.test(ua)) return 'Android Firefox';
    return 'Android Chrome';
  }
  return 'iPhone Safari (iOS 27)';
}

function srStandalone() {
  try {
    return !!(window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches));
  } catch (e) { return false; }
}

// The screen height to lay out for. An iPhone home screen web app (black-translucent status bar) can report a
// viewport about one status bar short (WebKit bug 301108), which left a gap at the bottom; the screen is the truth there.
function srViewH() {
  var vh = window.innerHeight;
  try {
    if (srStandalone() && /iPhone|iPod/.test(navigator.userAgent || '')) {
      var a = Math.max(screen.width, screen.height), b = Math.min(screen.width, screen.height);
      var full = window.innerWidth <= window.innerHeight ? a : b;
      if (full > vh && full - vh <= 140) vh = full;
    }
  } catch (e) { /* ignore */ }
  return vh;
}

// The phone's top safe area (status bar) in points. The boards assume 47pt; Dynamic Island phones have 59pt or 62pt.
// Read from env(safe-area-inset-top); if a phone reports 0 in its installed app, fall back to its known value.
var SR_SAFE_TOP = { '402x874': 62, '440x956': 62, '393x852': 59, '430x932': 59, '390x844': 47, '428x926': 47, '375x812': 44, '414x896': 44 };
function srSafeTop() {
  var v = 0;
  try {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px)';
    document.body.appendChild(d);
    v = parseFloat(getComputedStyle(d).paddingTop) || 0;
    d.remove();
  } catch (e) { /* ignore */ }
  if (!v && srStandalone() && /iPhone|iPod/.test(navigator.userAgent || '')) {
    var a = Math.min(screen.width, screen.height), b = Math.max(screen.width, screen.height);
    v = SR_SAFE_TOP[a + 'x' + b] || 0;
  }
  return v;
}

function srGiftHash(g) {
  var p = ['w=' + encodeURIComponent(g.w || 'xmas'), 'n=' + (g.n || 5)];
  if (g.opens) p.push('opens=' + encodeURIComponent(g.opens));
  if (g.note) p.push('note=' + encodeURIComponent(g.note));
  return (g.opens ? 'gift-locked' : 'gift') + '?' + p.join('&');
}

class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    this._device = srDevice();
    this._onResize = function () { self.measure(false); };
    this._onHash = function () { self.fromHash(); };
    window.addEventListener('resize', this._onResize);
    window.addEventListener('orientationchange', this._onResize);
    window.addEventListener('hashchange', this._onHash);
    var season = null;
    try { season = window.localStorage.getItem(SR_SEASON_KEY); } catch (e) { /* ignore */ }
    this.setState({ season: SR_SEASONS.indexOf(season) >= 0 ? season : SR_DEFAULT_SEASON });
    this.measure(true);
    this.fromHash();
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
    window.removeEventListener('orientationchange', this._onResize);
    window.removeEventListener('hashchange', this._onHash);
    clearTimeout(this._mt);
    clearTimeout(this._tt);
  }

  componentDidUpdate() {
    this.applyVars();
  }

  applyVars() {
    var L = this.layout();
    var h = L.h ? L.h + 'px' : '844px';
    if (h !== this._appH) {
      this._appH = h;
      document.documentElement.style.setProperty('--app-h', h);
    }
    // In a phone browser the status bar sits outside the page, so the homepage starts right at the top.
    // In a home screen web app the page runs under the status bar, so the doc homepage clears it too.
    var mt = L.mode === 'phone' ? '50px' : L.mode === 'doc' ? 'calc(env(safe-area-inset-top, 0px) + 12px)' : '';
    var de = document.documentElement;
    var vh = (this.state && this.state.vh) || this._vh || srViewH();
    if (vh + 'px' !== this._srVh) { this._srVh = vh + 'px'; de.style.setProperty('--sr-vh', vh + 'px'); }
    var pwa = srStandalone();
    de.classList.toggle('sr-pwa', pwa);
    // The app screens fill the screen and never scroll the page; the homepage scrolls like a website.
    de.classList.toggle('sr-lock', pwa && L.mode !== 'doc' && L.mode !== 'site');
    // Full screen on a phone (installed): the app's top bar sits below the real status bar. The boards assume 47pt,
    // so move it down by the difference, in board px.
    var st = 0;
    if (pwa && L.mode === 'phone' && !L.x && !L.y) {
      if (!this._safeTop) this._safeTop = srSafeTop();
      st = Math.max(0, Math.round((this._safeTop / (L.s || 1) - 47) * 10) / 10);
    }
    if (st + 'px' !== this._srSt) { this._srSt = st + 'px'; de.style.setProperty('--sr-st', st + 'px'); }
    if (mt !== this._mTop) {
      this._mTop = mt;
      if (mt) document.documentElement.style.setProperty('--m-top', mt);
      else document.documentElement.style.removeProperty('--m-top');
    }
  }

  measure(force) {
    var ae = document.activeElement;
    // A keyboard opening resizes some phones' viewport: keep the app the same height while typing.
    if (!force && ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
    var vw = window.innerWidth, vh = srViewH();
    var st = this.state || {};
    if (!force && st.vw === vw && st.vh === vh) return;
    if (!force && st.vw === vw && (this.layout().mode === 'doc' || this.layout().mode === 'site')) return;
    this.setState({ vw: vw, vh: vh });
    if (force) {
      this._vw = vw; this._vh = vh;
      this.applyVars();
    }
  }

  fromHash() {
    var self = this;
    var h = String(window.location.hash || '').replace(/^#/, '');
    var q = '';
    var k = h.indexOf('?');
    if (k >= 0) { q = h.slice(k + 1); h = h.slice(0, k); }
    var p = {};
    q.split('&').forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf('=');
      var key = i >= 0 ? kv.slice(0, i) : kv;
      var val = i >= 0 ? kv.slice(i + 1) : '';
      try { p[key] = decodeURIComponent(val.replace(/\+/g, ' ')); } catch (e) { p[key] = val; }
    });
    var route = SR_ROUTES.indexOf(h) >= 0 ? h : (!h && srStandalone() ? 'app' : 'home');
    var gift = null;
    if (route === 'gift' || route === 'gift-locked') {
      var locked = route === 'gift-locked';
      gift = {
        w: SR_WRAP_NAME[p.w] ? p.w : null,
        n: [1, 3, 5].indexOf(+p.n) >= 0 ? +p.n : 5,
        locked: locked,
        opens: locked ? (p.opens || null) : null,
        note: p.note ? String(p.note).slice(0, 80) : null
      };
    }
    // between the story and the gift cards page the homepage stays put and changes page itself
    var HS = { home: 1, 'home-phone': 1, gifts: 1 }, was = this.state || {};
    if (was.mount && HS[was.route || 'home'] && HS[route]) { this.setState({ route: route, gift: gift }); return; }
    clearTimeout(this._mt);
    this.setState({ route: route, gift: gift, mount: false });
    this._mt = setTimeout(function () { self.setState({ mount: true }); }, 40);
    try { window.scrollTo(0, 0); } catch (e) { /* ignore */ }
  }

  go(hash) {
    if (String(window.location.hash || '').replace(/^#/, '') === hash) this.fromHash();
    else window.location.hash = hash;
  }

  layout() {
    var st = this.state || {};
    var vw = st.vw || this._vw || window.innerWidth;
    var vh = st.vh || this._vh || srViewH();
    var route = st.route || 'home';
    var wide = vw >= 760 && vh >= 560;
    if (route === 'home' || route === 'home-phone' || route === 'gifts') {
      return { mode: 'site', cls: 'pr-site', inPhone: false, wide: wide, h: 844 };
    }
    if (wide) {
      var bz = 12;
      var s = Math.min(1, (vh - 40) / (844 + bz * 2));
      var fw = (390 + bz * 2) * s, fh = (844 + bz * 2) * s;
      var x = Math.max(20, (vw - fw) / 2);
      return { mode: 'wide', cls: 'pr-fixed pr-wide', inPhone: true, wide: true, s: s, h: 844, x: x, y: (vh - fh) / 2, fw: fw, fh: fh, bz: bz * s, rad: 55, frad: (55 + bz) * s };
    }
    // The mobile site scrolls, so it fills any phone. The app is laid out for a full 844pt screen (installed):
    // it fills when the phone is that tall, and otherwise scales down to fit.
    var s1 = vw / 390, h1 = vh / s1;
    // The homepage on a real phone scrolls the page itself, so Safari can run it under the status bar and toolbar.
    if ((route === 'home' || route === 'home-phone') && vw < 600) {
      return { mode: 'doc', cls: 'pr-doc', inPhone: false, doc: true, wide: false, s: s1, h: Math.round(h1) };
    }
    var minH = (route === 'home' || route === 'home-phone') ? 560 : 844;
    if (vw < 600 && h1 >= minH && h1 <= 1000) {
      return { mode: 'phone', cls: 'pr-fixed pr-phone', inPhone: true, wide: false, s: s1, h: Math.round(h1), x: 0, y: 0, fw: vw, fh: vh, bz: 0, rad: 0, frad: 0 };
    }
    var s2 = Math.min(vw / 390, vh / 844);
    return { mode: 'phone', cls: 'pr-fixed pr-phone', inPhone: true, wide: false, s: s2, h: 844, x: (vw - 390 * s2) / 2, y: (vh - 844 * s2) / 2, fw: 390 * s2, fh: 844 * s2, bz: 0, rad: 0, frad: 0 };
  }

  renderVals() {
    var self = this;
    var st = this.state || {};
    var L = this.layout();
    var route = st.route || 'home';
    var mount = st.mount === true;
    var season = st.season || SR_DEFAULT_SEASON;
    var wrap = SR_MAIN_WRAP[season] || 'None';
    var seasonWrap = wrap === 'None' ? 'Classic' : wrap;
    var gp = st.gift || {};
    var gWrap = SR_WRAP_NAME[gp.w] || seasonWrap;
    var g = {
      wrap: gWrap,
      pack: (gp.n || 5) + ' Pack',
      lock: gp.locked ? 'Locked' : 'Opens now',
      opens: gp.opens || null,
      note: gp.note || null
    };
    var isHome = route === 'home' || route === 'home-phone' || route === 'gifts';
    var r = {
      homeDesk: mount && L.mode === 'site',
      homeMob: mount && L.inPhone && isHome,
      homeDoc: mount && !!L.doc && isHome,
      app: mount && route === 'app',
      giftco: mount && route === 'gift-checkout',
      gift: mount && (route === 'gift' || route === 'gift-locked'),
      card: mount && route === 'card',
      returning: mount && route === 'returning'
    };
    return {
      L: L, r: r, g: g,
      wrap: wrap,
      giftWrap: seasonWrap,
      hs: SR_HOME_SEASON[season] || 'Classic',
      device: L.wide ? 'iPhone Safari (iOS 27)' : (this._device || srDevice()),
      // The app keeps its demo account (cards, balance, riplink) on this device until Sign out.
      persist: true,
      goApp: function () { self.go('app'); },
      hp: route === 'gifts' ? 'Gift cards' : 'Home',
      nav: function (p) {
        if (p === 'gifts') { self.go('gifts'); return; }
        try { window.history.pushState(null, '', window.location.pathname + window.location.search); } catch (e) { /* ignore */ }
        self.fromHash();
      },
      goGiftCo: function () { self.go('gift-checkout'); },
      // Picking a gift wrap switches the whole theme (app and homepage) and remembers it.
      wrapPick: function (k) {
        var s = SR_SEASON_OF_WRAP[k];
        if (!s || s === (self.state || {}).season) return;
        try { window.localStorage.setItem(SR_SEASON_KEY, s); } catch (e) { /* ignore */ }
        self.setState({ season: s });
      },
      // Share and copy send a link to this demo, so whoever opens it lands on the same gift.
      shareUrl: function (gs) {
        var base = String(window.location.href).split('#')[0];
        return base + '#' + srGiftHash({ w: gs && gs.w, n: gs && gs.n, opens: gs && gs.opens, note: gs && gs.note });
      }
    };
  }
}

</script>
