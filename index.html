<style>
@font-face{font-family:Inter;font-style:normal;font-weight:100 900;font-display:swap;src:url(inter.woff2) format("woff2")}
html,body{margin:0;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:#050506}
.m-root:not(.full):not(.doc){height:var(--app-h,844px)}
.m-root:not(.full):not(.doc) .m-bg{height:100%}
.m-root:not(.full):not(.doc) .m-fade{top:auto;bottom:0}
.pr-doc{position:relative;background:#050506}
.pr-docwrap{width:390px}
.pr-fixed{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;touch-action:manipulation}
.pr-fixed.pr-wide{background:#ffffff}
.pr-fixed.pr-phone{background:#050506}
.pr-stage{position:absolute;overflow:hidden}
.pr-wide .pr-stage{background:#000000;box-shadow:0 0 0 1px #c8c8c8}
.pr-screen{position:absolute;left:0;top:0;width:390px;transform-origin:0 0;overflow:hidden;background:#050506}
.pr-ui,.pr-ui button{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.pr-ui{color:#000000}
.pr-ui button{cursor:pointer}
.pr-pill{position:fixed;z-index:1000;display:flex;align-items:center;gap:6px;height:32px;padding:0 14px;border:0;border-radius:999px;background:#ffffff;color:#000000;font-size:13px;font-weight:600;box-shadow:0 1px 6px rgba(0,0,0,.45)}
.pr-pill.top{left:50%;top:calc(env(safe-area-inset-top,0px) + 6px);transform:translateX(-50%);height:28px;padding:0 12px;font-size:12px}
.pr-pill.side{left:16px;top:calc(env(safe-area-inset-top,0px) + 12px)}
.pr-pill.corner{left:16px;bottom:16px;height:40px;font-size:14px}
.pr-pill svg{width:14px;height:14px}
.pr-panelwrap{position:fixed;z-index:1100;top:0;bottom:0;left:0}
.pr-panelwrap.drawer{right:0}
.pr-scrim{position:absolute;left:0;top:0;right:0;bottom:0;border:0;padding:0;background:rgba(0,0,0,.45);cursor:default}
.pr-panel{position:absolute;left:0;top:0;bottom:0;width:320px;box-sizing:border-box;overflow-y:auto;padding:24px 20px 28px;background:#ffffff;color:#000000;border-right:1px solid #d6d6d6}
.pr-panelwrap.drawer .pr-panel{width:min(360px,100%);border-right:0;padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
.pr-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.pr-panel h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.pr-panel p{margin:6px 0 0;font-size:14px;line-height:1.45;color:#4a4a4a}
.pr-panel h2{margin:24px 0 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4a4a4a}
.pr-x{flex:none;display:grid;place-items:center;width:44px;height:44px;margin:-8px -8px 0 0;padding:0;border:0;border-radius:50%;background:none;color:#000000}
.pr-x svg{width:20px;height:20px}
.pr-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.pr-item{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:44px;padding:10px 10px;border:0;border-radius:10px;background:none;color:#000000;text-align:left;font-size:15px}
.pr-item:hover{background:#f2f2f2}
.pr-item.on{background:#ececec}
.pr-n{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid #000000;box-sizing:border-box;font-size:12px;font-weight:700}
.pr-item.on .pr-n{background:#000000;color:#ffffff}
.pr-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.pr-t .pr-ti{font-size:15px;font-weight:600;color:#000000}
.pr-t .pr-sub{font-size:13px;line-height:1.4;color:#4a4a4a}
.pr-item.on .pr-t .pr-ti{font-weight:700}
.pr-seg{display:flex;flex-wrap:wrap;gap:6px}
.pr-seg button{min-height:36px;padding:0 12px;border:1px solid #000000;border-radius:999px;background:#ffffff;color:#000000;font-size:13px;font-weight:600}
.pr-seg button[aria-pressed="true"]{background:#000000;color:#ffffff}
.pr-tip{margin:20px 0 0;padding:12px 14px;border-radius:10px;background:#f2f2f2;font-size:14px;line-height:1.45;color:#000000}
.pr-tip button{display:block;margin-top:10px;min-height:36px;padding:0 14px;border:0;border-radius:999px;background:#000000;color:#ffffff;font-size:13px;font-weight:600}
.pr-actions{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px}
.pr-actions button{min-height:40px;padding:0 16px;border:1px solid #000000;border-radius:999px;background:#ffffff;color:#000000;font-size:14px;font-weight:600}
.pr-toast{position:fixed;z-index:1200;display:flex;align-items:center;gap:10px;box-sizing:border-box;padding:10px 8px 10px 16px;border-radius:16px;background:#ffffff;color:#000000;box-shadow:0 4px 20px rgba(0,0,0,.35);font-size:14px;line-height:1.35}
.pr-toast.top{left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 42px)}
.pr-toast.side{left:16px;bottom:16px;max-width:calc(100vw - 32px)}
.pr-wide .pr-toast.side,.pr-toast.side.beside{left:340px}
.pr-toast .pr-tt{flex:1 1 auto;min-width:0}
.pr-toast .go{flex:none;min-height:36px;padding:0 14px;border:0;border-radius:999px;background:#000000;color:#ffffff;font-size:13px;font-weight:600}
.pr-toast .x{flex:none;display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:50%;background:none;color:#000000}
.pr-toast .x svg{width:16px;height:16px}
</style>
</helmet>
<div class="{{L.cls}}">

<sc-if value="{{r.homeDesk}}" hint-placeholder-val="{{false}}">
<dc-import name="SrHome" season="{{hs}}" metal="Silver" on-continue="{{goApp}}" hint-size="100%,6000px"></dc-import>
</sc-if>

<sc-if value="{{r.homeDoc}}" hint-placeholder-val="{{false}}">
<div class="pr-docwrap" style="zoom: {{L.s}}">
<dc-import name="SrMobile" mode="Page" device="{{device}}" season="{{hs}}" metal="Silver" on-continue="{{goApp}}" hint-size="390px,844px"></dc-import>
</div>
</sc-if>

<sc-if value="{{L.inPhone}}" hint-placeholder-val="{{true}}">
<div class="pr-stage" style="left: {{L.x}}px; top: {{L.y}}px; width: {{L.fw}}px; height: {{L.fh}}px; border-radius: {{L.frad}}px;">
<div class="pr-screen" style="left: {{L.bz}}px; top: {{L.bz}}px; height: {{L.h}}px; transform: scale({{L.s}}); border-radius: {{L.rad}}px;">
<sc-if value="{{r.homeMob}}" hint-placeholder-val="{{false}}">
<dc-import name="SrMobile" device="{{device}}" season="{{hs}}" metal="Silver" on-continue="{{goApp}}" hint-size="390px,844px"></dc-import>
</sc-if>
<sc-if value="{{r.app}}" hint-placeholder-val="{{false}}">
<dc-import name="SrApp" mode="App" wrap="{{wrap}}" share-url="{{shareUrl}}" on-gift-share="{{onShare}}" hint-size="390px,844px"></dc-import>
</sc-if>
<sc-if value="{{r.giftco}}" hint-placeholder-val="{{false}}">
<dc-import name="SrApp" screen="Gift checkout" wrap="{{giftWrap}}" gift-pack="5 Pack" share-url="{{shareUrl}}" on-gift-share="{{onShare}}" hint-size="390px,844px"></dc-import>
</sc-if>
<sc-if value="{{r.gift}}" hint-placeholder-val="{{false}}">
<dc-import name="SrApp" screen="Gift link" wrap="{{g.wrap}}" gift-pack="{{g.pack}}" gift-lock="{{g.lock}}" gift-opens="{{g.opens}}" gift-note="{{g.note}}" share-url="{{shareUrl}}" on-gift-share="{{onShare}}" hint-size="390px,844px"></dc-import>
</sc-if>
<sc-if value="{{r.card}}" hint-placeholder-val="{{false}}">
<dc-import name="SrApp" screen="Card" self-demo="On" hint-size="390px,844px"></dc-import>
</sc-if>
<sc-if value="{{r.returning}}" hint-placeholder-val="{{false}}">
<dc-import name="SrApp" portfolio="Returning" wrap="{{wrap}}" share-url="{{shareUrl}}" on-gift-share="{{onShare}}" hint-size="390px,844px"></dc-import>
</sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{ui.pill}}" hint-placeholder-val="{{false}}">
<button type="button" class="pr-ui pr-pill {{ui.pillCls}}" aria-label="Open the prototype menu" onClick="{{openMenu}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg><span>Prototype</span></button>
</sc-if>

<sc-if value="{{ui.panel}}" hint-placeholder-val="{{false}}">
<div class="pr-ui pr-panelwrap {{ui.panelCls}}">
<sc-if value="{{ui.drawer}}" hint-placeholder-val="{{false}}">
<button type="button" class="pr-scrim" aria-label="Close the menu" onClick="{{closeMenu}}"></button>
</sc-if>
<aside class="pr-panel" aria-label="Prototype menu">
<div class="pr-head">
<div>
<h1>StockRip prototype</h1>
<p>Tap through it like the real app. No real money moves.</p>
</div>
<sc-if value="{{ui.drawer}}" hint-placeholder-val="{{false}}">
<button type="button" class="pr-x" aria-label="Close the menu" onClick="{{closeMenu}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</sc-if>
</div>
<h2>The flow</h2>
<ol class="pr-list">
<sc-for list="{{flow}}" as="it" hint-placeholder-count="3">
<li><button type="button" class="pr-item {{it.cls}}" aria-current="{{it.cur}}" onClick="{{it.go}}"><span class="pr-n" aria-hidden="true">{{it.n}}</span><span class="pr-t"><b class="pr-ti">{{it.title}}</b><span class="pr-sub">{{it.sub}}</span></span></button></li>
</sc-for>
</ol>
<h2>Jump to</h2>
<ul class="pr-list">
<sc-for list="{{more}}" as="it" hint-placeholder-count="6">
<li><button type="button" class="pr-item {{it.cls}}" aria-current="{{it.cur}}" onClick="{{it.go}}"><span class="pr-t"><b class="pr-ti">{{it.title}}</b><span class="pr-sub">{{it.sub}}</span></span></button></li>
</sc-for>
</ul>
<h2>Season</h2>
<div class="pr-seg" role="group" aria-label="Season">
<sc-for list="{{seasons}}" as="s" hint-placeholder-count="4">
<button type="button" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}">{{s.label}}</button>
</sc-for>
</div>
<sc-if value="{{tip.on}}" hint-placeholder-val="{{true}}">
<div class="pr-tip">{{tip.text}}<sc-if value="{{tip.act}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{tip.act}}">{{tip.actLabel}}</button></sc-if></div>
</sc-if>
<div class="pr-actions">
<button type="button" onClick="{{restart}}">Restart this screen</button>
</div>
</aside>
</div>
</sc-if>

<sc-if value="{{toast.on}}" hint-placeholder-val="{{false}}">
<div class="pr-ui pr-toast {{toast.cls}}" role="status">
<span class="pr-tt">{{toast.text}}</span>
<button type="button" class="go" onClick="{{toast.go}}">See what they get</button>
<button type="button" class="x" aria-label="Dismiss" onClick="{{toast.close}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{}'>

// StockRip prototype: one page that routes between the homepage, the app and the gift link.
var SR_SEASONS = ['Classic', 'Christmas', 'Lunar New Year', 'Valentine’s'];
var SR_MAIN_WRAP = { 'Classic': 'None', 'Christmas': 'Christmas', 'Lunar New Year': 'Lunar New Year', 'Valentine’s': 'Valentine’s' };
var SR_HOME_SEASON = { 'Classic': 'Classic', 'Christmas': 'Christmas', 'Lunar New Year': 'Lunar New Year', 'Valentine’s': "Valentine's" };
var SR_WRAP_KEY = { 'Christmas': 'xmas', 'Lunar New Year': 'lny', 'Valentine’s': 'val' };
var SR_WRAP_NAME = { xmas: 'Christmas', lny: 'Lunar New Year', val: 'Valentine’s' };
var SR_DAY = { 'Christmas': 'Christmas Day', 'Lunar New Year': 'Lunar New Year', 'Valentine\u2019s': 'Valentine\u2019s Day' };
var SR_ROUTES = ['home', 'home-phone', 'app', 'gift', 'gift-locked', 'gift-checkout', 'card', 'returning'];

function srDevice() {
  var ua = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
  var touchMac = /Macintosh/.test(ua) && typeof navigator !== 'undefined' && navigator.maxTouchPoints > 1;
  var inApp = /FBAN|FBAV|Instagram|Twitter|Line\/|musical_ly|BytedanceWebview|Snapchat|LinkedInApp/.test(ua);
  if (/iPad/.test(ua) || touchMac) return 'iPad Safari';
  if (/iPhone|iPod/.test(ua)) {
    if (inApp) return 'In-app browser (iPhone)';
    if (/CriOS|FxiOS|EdgiOS/.test(ua)) return 'iPhone Chrome';
    var v = /Version\/(\d+)/.exec(ua);
    var n = v ? +v[1] : 18;
    return n >= 27 ? 'iPhone Safari (iOS 27)' : n >= 26 ? 'iPhone Safari (iOS 26)' : 'iPhone Safari (iOS 18)';
  }
  if (/Android/.test(ua)) {
    if (inApp || /; wv\)/.test(ua)) return 'In-app browser (Android)';
    if (/Firefox/.test(ua)) return 'Android Firefox';
    return 'Android Chrome';
  }
  return 'iPhone Safari (iOS 27)';
}

function srStandalone() {
  try {
    return !!(window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches));
  } catch (e) { return false; }
}

function srGiftHash(g) {
  var p = ['w=' + encodeURIComponent(g.w || 'xmas'), 'n=' + (g.n || 5)];
  if (g.opens) p.push('opens=' + encodeURIComponent(g.opens));
  if (g.note) p.push('note=' + encodeURIComponent(g.note));
  return (g.opens ? 'gift-locked' : 'gift') + '?' + p.join('&');
}

class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    this._device = srDevice();
    this._onResize = function () { self.measure(false); };
    this._onHash = function () { self.fromHash(); };
    window.addEventListener('resize', this._onResize);
    window.addEventListener('orientationchange', this._onResize);
    window.addEventListener('hashchange', this._onHash);
    var season = null;
    try { season = window.localStorage.getItem('srp-season'); } catch (e) { /* ignore */ }
    this.setState({ season: SR_SEASONS.indexOf(season) >= 0 ? season : 'Christmas' });
    this.measure(true);
    this.fromHash();
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
    window.removeEventListener('orientationchange', this._onResize);
    window.removeEventListener('hashchange', this._onHash);
    clearTimeout(this._mt);
    clearTimeout(this._tt);
  }

  componentDidUpdate() {
    this.applyVars();
  }

  applyVars() {
    var L = this.layout();
    var h = L.h ? L.h + 'px' : '844px';
    if (h !== this._appH) {
      this._appH = h;
      document.documentElement.style.setProperty('--app-h', h);
    }
    // In a phone browser the status bar sits outside the page, so the homepage starts higher (below the Prototype pill).
    var mt = L.mode === 'phone' || L.mode === 'doc' ? '50px' : '';
    if (mt !== this._mTop) {
      this._mTop = mt;
      if (mt) document.documentElement.style.setProperty('--m-top', mt);
      else document.documentElement.style.removeProperty('--m-top');
    }
  }

  measure(force) {
    var ae = document.activeElement;
    // A keyboard opening resizes some phones' viewport: keep the app the same height while typing.
    if (!force && ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
    var vw = window.innerWidth, vh = window.innerHeight;
    var st = this.state || {};
    if (!force && st.vw === vw && st.vh === vh) return;
    if (!force && st.vw === vw && this.layout().mode === 'doc') return;
    this.setState({ vw: vw, vh: vh });
    if (force) {
      this._vw = vw; this._vh = vh;
      this.applyVars();
    }
  }

  fromHash() {
    var self = this;
    var h = String(window.location.hash || '').replace(/^#/, '');
    var q = '';
    var k = h.indexOf('?');
    if (k >= 0) { q = h.slice(k + 1); h = h.slice(0, k); }
    var p = {};
    q.split('&').forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf('=');
      var key = i >= 0 ? kv.slice(0, i) : kv;
      var val = i >= 0 ? kv.slice(i + 1) : '';
      try { p[key] = decodeURIComponent(val.replace(/\+/g, ' ')); } catch (e) { p[key] = val; }
    });
    var route = SR_ROUTES.indexOf(h) >= 0 ? h : (!h && srStandalone() ? 'app' : 'home');
    var gift = null;
    if (route === 'gift' || route === 'gift-locked') {
      var locked = route === 'gift-locked';
      gift = {
        w: SR_WRAP_NAME[p.w] ? p.w : null,
        n: [1, 3, 5].indexOf(+p.n) >= 0 ? +p.n : 5,
        locked: locked,
        opens: locked ? (p.opens || null) : null,
        note: p.note ? String(p.note).slice(0, 80) : null
      };
    }
    clearTimeout(this._mt);
    this.setState({ route: route, gift: gift, mount: false, menu: false });
    this._mt = setTimeout(function () { self.setState({ mount: true }); }, 40);
    try { window.scrollTo(0, 0); } catch (e) { /* ignore */ }
  }

  go(hash) {
    if (String(window.location.hash || '').replace(/^#/, '') === hash) this.fromHash();
    else window.location.hash = hash;
  }

  layout() {
    var st = this.state || {};
    var vw = st.vw || this._vw || window.innerWidth;
    var vh = st.vh || this._vh || window.innerHeight;
    var route = st.route || 'home';
    var wide = vw >= 760 && vh >= 560;
    if (route === 'home' && vw >= 700) {
      return { mode: 'site', cls: 'pr-site', inPhone: false, wide: wide, h: 844 };
    }
    if (wide) {
      var panelW = 320, bz = 12;
      var s = Math.min(1, (vh - 40) / (844 + bz * 2));
      var fw = (390 + bz * 2) * s, fh = (844 + bz * 2) * s;
      var x = panelW + Math.max(20, (vw - panelW - fw) / 2);
      return { mode: 'wide', cls: 'pr-fixed pr-wide', inPhone: true, wide: true, s: s, h: 844, x: x, y: (vh - fh) / 2, fw: fw, fh: fh, bz: bz * s, rad: 55, frad: (55 + bz) * s };
    }
    // The mobile site scrolls, so it fills any phone. The app is laid out for a full 844pt screen (installed):
    // it fills when the phone is that tall, and otherwise scales down to fit.
    var s1 = vw / 390, h1 = vh / s1;
    // The homepage on a real phone scrolls the page itself, so Safari can run it under the status bar and toolbar.
    if ((route === 'home' || route === 'home-phone') && vw < 600) {
      return { mode: 'doc', cls: 'pr-doc', inPhone: false, doc: true, wide: false, s: s1, h: Math.round(h1) };
    }
    var minH = (route === 'home' || route === 'home-phone') ? 560 : 844;
    if (vw < 600 && h1 >= minH && h1 <= 1000) {
      return { mode: 'phone', cls: 'pr-fixed pr-phone', inPhone: true, wide: false, s: s1, h: Math.round(h1), x: 0, y: 0, fw: vw, fh: vh, bz: 0, rad: 0, frad: 0 };
    }
    var s2 = Math.min(vw / 390, vh / 844);
    return { mode: 'phone', cls: 'pr-fixed pr-phone', inPhone: true, wide: false, s: s2, h: 844, x: (vw - 390 * s2) / 2, y: (vh - 844 * s2) / 2, fw: 390 * s2, fh: 844 * s2, bz: 0, rad: 0, frad: 0 };
  }

  renderVals() {
    var self = this;
    var st = this.state || {};
    var L = this.layout();
    var route = st.route || 'home';
    var mount = st.mount === true;
    var season = st.season || 'Christmas';
    var wrap = SR_MAIN_WRAP[season] || 'None';
    var seasonWrap = wrap === 'None' ? 'Christmas' : wrap;
    var gp = st.gift || {};
    var gWrap = SR_WRAP_NAME[gp.w] || seasonWrap;
    var g = {
      wrap: gWrap,
      pack: (gp.n || 5) + ' Pack',
      lock: gp.locked ? 'Locked' : 'Opens now',
      opens: gp.opens || null,
      note: gp.note || null
    };
    var isHome = route === 'home' || route === 'home-phone';
    var r = {
      homeDesk: mount && L.mode === 'site',
      homeMob: mount && L.inPhone && isHome,
      homeDoc: mount && !!L.doc && isHome,
      app: mount && route === 'app',
      giftco: mount && route === 'gift-checkout',
      gift: mount && (route === 'gift' || route === 'gift-locked'),
      card: mount && route === 'card',
      returning: mount && route === 'returning'
    };
    var item = function (id, n, title, sub, active) {
      var on = active !== undefined ? active : route === id;
      return { n: n, title: title, sub: sub, cls: on ? 'on' : '', cur: on ? 'page' : undefined, go: function () { self.go(id); } };
    };
    var sent = st.sent;
    var friendOn = route === 'gift' || (route === 'gift-locked' && !!sent);
    var friendGo = function () { self.go(sent ? srGiftHash(sent) : 'gift'); };
    var flow = [
      item('home', 1, 'Homepage', 'Someone new lands on stockrip.com', route === 'home'),
      item('app', 2, 'The app', 'Buy a pack or gift one: sign in, add funds, pay, rip'),
      { n: 3, title: 'Your friend opens the gift', sub: sent ? 'The gift you just sent' : 'Sign in, rip it, their first stocks', cls: friendOn ? 'on' : '', cur: friendOn ? 'page' : undefined, go: friendGo }
    ];
    var more = [
      item('gift-checkout', '', 'Gift a pack', 'Straight to checkout with Gift on'),
      item('gift-locked', '', 'A gift that opens on a date', 'Locked until ' + SR_DAY[seasonWrap], route === 'gift-locked' && !sent),
      item('card', '', 'Card page', 'The Tesla card, self-trading coming soon'),
      item('returning', '', 'Returning user', 'Home with cards already in it')
    ];
    if (L.wide) more.push(item('home-phone', '', 'Homepage on a phone', 'The mobile site in the frame'));
    var seasons = SR_SEASONS.map(function (s) {
      return {
        label: s, pressed: s === season ? 'true' : 'false',
        pick: function () {
          try { window.localStorage.setItem('srp-season', s); } catch (e) { /* ignore */ }
          self.setState({ season: s });
        }
      };
    });
    var phoneHome = route === 'home-phone' || (route === 'home' && (L.inPhone || L.doc));
    var TIPS = {
      'home': phoneHome ? 'Tap the button at the bottom, then Continue in browser to open the app.' : 'Click GET THE APP or GIFT A PACK, then Continue on this computer to open the app.',
      'home-phone': 'Tap the button at the bottom, then Continue in browser to open the app.',
      'app': 'Tap BUY to sign in, add funds, pay and rip. In checkout, turn on Gift a pack to send it to a friend instead.',
      'gift-checkout': 'Pick a wrap, add a note, choose when it opens, then GET GIFT LINK.',
      'gift': 'This is what your friend sees. They sign in, rip it, then say thanks or gift one back.',
      'gift-locked': 'Your friend can see the gift but can’t rip it until the day it opens.',
      'card': 'A card page. Self-trading is coming soon, so its switch stays off.',
      'returning': 'Home for someone who already has cards.'
    };
    var tip = { on: !!TIPS[route], text: TIPS[route] || '', act: null, actLabel: '' };
    if (route === 'gift-locked') {
      tip.act = function () {
        self.go(srGiftHash({ w: gp.w || SR_WRAP_KEY[gWrap], n: gp.n || 5, note: gp.note }));
      };
      tip.actLabel = 'Open it now instead';
    }
    var drawer = !L.wide || L.mode === 'site';
    var ui = {
      pill: drawer && !st.menu,
      pillCls: L.mode === 'site' ? 'corner' : (L.x >= 140 ? 'side' : 'top'),
      panel: !drawer || !!st.menu,
      drawer: drawer,
      panelCls: drawer ? 'drawer' : 'pinned'
    };
    var toast = {
      on: !!st.toast,
      cls: L.mode === 'phone' ? 'top' : L.mode === 'wide' ? 'side beside' : 'side',
      text: st.toast === 'shared' ? 'Gift sent.' : 'Gift link copied.',
      go: function () { self.setState({ toast: false }); friendGo(); },
      close: function () { self.setState({ toast: false }); }
    };
    return {
      L: L, r: r, g: g, ui: ui, tip: tip, toast: toast,
      flow: flow, more: more, seasons: seasons,
      wrap: wrap,
      giftWrap: seasonWrap,
      hs: SR_HOME_SEASON[season] || 'Classic',
      device: L.wide ? 'iPhone Safari (iOS 27)' : (this._device || srDevice()),
      goApp: function () { self.go('app'); },
      openMenu: function () { self.setState({ menu: true }); },
      closeMenu: function () { self.setState({ menu: false }); },
      restart: function () { self.fromHash(); },
      // The share button in the app sends a link to this prototype, so whoever opens it lands on the same gift.
      shareUrl: function (gs) {
        var base = String(window.location.href).split('#')[0];
        return base + '#' + srGiftHash({ w: gs && gs.w, n: gs && gs.n, opens: gs && gs.opens, note: gs && gs.note });
      },
      onShare: function (gs, how) {
        clearTimeout(self._tt);
        self.setState({ sent: { w: gs && gs.w, n: gs && gs.n, opens: gs && gs.opens, note: gs && gs.note }, toast: how === 'shared' ? 'shared' : 'copied' });
        self._tt = setTimeout(function () { self.setState({ toast: false }); }, 12000);
      }
    };
  }
}

</script>
<script src="sr-support.js"></script>
